# iOS build for Yu+Mi · A.D.H.D (Capacitor 8). iOS apps can ONLY be compiled on
# macOS — this workflow is the no-Mac path. Push the repo to GitHub, then run it
# via Actions -> "iOS build" -> Run workflow.
#
# Default job verifies the app compiles (unsigned). To produce a signed IPA
# for App Store Connect, add these repo secrets and the fastlane step below:
#   APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD, APPLE_PROVISION_PROFILE_BASE64,
#   APP_STORE_CONNECT_API_KEY_JSON  (preferred over password auth)
name: iOS build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build web app (SPA shell)
        run: npm run build:app

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Capacitor 8 uses Swift Package Manager (Package.swift) — no pods, and therefore
      # NO App.xcworkspace: build the project directly with -project App.xcodeproj.
      - name: Build archive (unsigned verification)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/YuMi.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - uses: actions/upload-artifact@v4
        with:
          name: YuMi-xcarchive-unsigned
          path: ${{ runner.temp }}/YuMi.xcarchive

